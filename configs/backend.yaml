# Management backend configuration (template, safe to commit).
# For local/dev runs put real values in `configs/local.yaml` (gitignored) and
# start with: ./bin/backend.exe -config configs/local.yaml
# Secrets can also come from environment variables:
#   DB_HOST, DB_PORT, DB_USER, DB_NAME, DB_PASSWORD, DB_DSN (optional full DSN),
#   LISTEN_ADDR, LOG_DIR, FRONTEND_DIR, ALLOW_ORIGIN, ACCESS_PASSWORD,
#   SESSION_HOURS, JWT_SECRET, JWT_MINUTES,
#   MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MINIO_BUCKET,
#   MINIO_UPDATE_BASE_URL
#
# Access uses username/password accounts with two roles (admin/user), plus
# short-lived JWTs and long-lived API tokens for scripts. This is still not a
# hardened auth system: no TLS, no MFA, no Agent authentication. Bind to a
# private management interface only.

listen_addr: "127.0.0.1:8089"
# Set to a concrete origin in production, e.g. "http://10.0.0.10".
allow_origin: "*"
# When the built frontend is deployed alongside the backend, point this at it.
# Empty disables static serving.
frontend_dir: ""

log_dir: "./data/logs"

# Bootstrap password for the built-in `admin` account. It is only applied when
# no admin user exists yet; afterwards the password lives in the database and is
# changed from the UI. An empty value seeds `changeme`. Prefer the
# ACCESS_PASSWORD env var when deploying: it keeps the secret out of the file.
auth:
  access_password: ""
  session_hours: 12
  # Signs short-lived JWT bearer tokens (POST /api/v1/auth/token). Leave empty
  # to auto-generate and persist a key in app_settings on first start; set
  # JWT_SECRET to rotate it (which invalidates all outstanding JWTs).
  jwt_secret: ""
  jwt_minutes: 120

mysql:
  host: "127.0.0.1"
  port: 3306
  user: "ops"
  password: ""            # prefer DB_PASSWORD env var
  dbname: "linux_ops"
  dsn: ""                 # optional full DSN; overrides the fields above
  max_open_conns: 20
  max_idle_conns: 5
  auto_migrate: true      # false only if you applied database/schema.sql manually
  seed: true              # create the bootstrap admin; also inserts demo data when servers is empty

# Object store for agent packages (also used by bin/minio_upload.py).
# Leave secrets empty here; put real values in configs/local.yaml.
minio:
  endpoint: "http://127.0.0.1:9000"
  access_key: ""
  secret_key: ""
  bucket: "wxgzt-ops"
  update_base_url: "http://127.0.0.1:9000/wxgzt-ops"

scheduler:
  heartbeat_interval_sec: 20
  dispatch_concurrency: 8
  poll_interval_ms: 300
  default_timeout_ms: 300000
  max_timeout_ms: 3600000
  max_script_bytes: 65536
  max_output_bytes: 10485760
  agent_request_timeout_sec: 10

websocket:
  max_connections: 200
  replay_buffer_len: 2000
  max_terminal_sessions: 16     # concurrent interactive terminals proxied by the backend
