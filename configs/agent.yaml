# Agent configuration.
#
# SECURITY: the agent has no authentication. It only accepts requests whose
# source IP matches `allowed_ips`, and 0.0.0.0 / :: / 0.0.0.0/0 are rejected at
# startup. List the exact backend host IPs (multiple entries and CIDRs are
# supported).
#
# The installer (scripts/agent-install.sh) generates this file; edit it there
# or rerun the installer with --force.

# Bind address. "auto" (default) picks this host's primary non-loopback IPv4
# at startup, preferring a private RFC1918 address, so the same file can be
# deployed unchanged on every host. The chosen address is logged at startup:
#   journalctl -u wxgzt-ops -n 20
# Set an explicit IP when the host has several networks and the backend must
# reach a non-primary one:
#   listen_addr: "10.0.0.11"
listen_addr: "auto"
listen_port: 19090

# Source addresses allowed to call the agent (REST and WebSocket). At least one
# entry is required. Example for a backend on 10.0.0.5 and a standby on
# 10.0.0.6:
#   allowed_ips:
#     - "10.0.0.5"
#     - "10.0.0.6"
allowed_ips:
  - "10.206.172.99"

work_dir: "/tmp"
log_dir: "./data/agent-logs"        # reserved; the agent writes no log files (journald only)

max_concurrent: 8                    # concurrent command executions
max_output_bytes: 10485760           # 10 MiB per stream, then truncated
max_script_bytes: 1048576            # max command length accepted
default_timeout_ms: 300000
max_timeout_ms: 3600000
task_retention_sec: 3600             # keep finished task records in memory this long

# Interactive terminal (PTY). The shell runs as the agent's own user unless
# user: "root" is set. In this deployment the agent runs as root, so an empty
# value is already a root shell.
terminal:
  shell: "/bin/bash"
  work_dir: "/"
  user: ""                           # empty = agent user (root here); "root" is equivalent
  max_sessions: 4                    # concurrent PTY sessions on this host
  idle_timeout_sec: 600              # close a session idle this long (0 = off)
  max_duration_sec: 3600             # hard cap per session (0 = off)
  # Bash history for interactive sessions:
  #   memory  - (default) history works inside the session but is never
  #             persisted; the user's ~/.bash_history is not touched
  #   inherit - behave like a normal login shell and let bash append to the
  #             user's ~/.bash_history (keeps a local trail on the host)
  # This only affects bash history. journald/auditd/process accounting and the
  # platform's own terminal.open/terminal.close audit are unaffected.
  history_mode: "memory"

# Self-update. The agent scans this S3/MinIO prefix (anonymous ListBucket) for
# files named wxgzt-ops-agent-<version>-linux-<arch>.tar.gz and offers the highest
# version above its own. Uploading a correctly named tarball is enough;
# manifest.json and SHA256SUMS are optional and only add notes/checksums.
# Set to "" to disable. Requires anonymous s3:ListBucket + s3:GetObject.
update_base_url: "http://127.0.0.1:9000/wxgzt-ops"
# Refuse builds that have no published sha256. Off by default so a bare tarball
# upload works; turn on for stricter integrity checking.
update_require_checksum: false
